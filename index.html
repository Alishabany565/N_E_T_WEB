<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="appTitle">Expense Tracker</title>
  <link rel="stylesheet" href="css/landing.css" />
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>

  <button
    id="a11yFab"
    class="a11y-fab"
    type="button"
    aria-label="Accessibility"
    data-i18n-aria="accessibility"
    aria-expanded="false"
    aria-controls="a11yPanel"
    title="Accessibility"
    data-i18n-title="accessibility"
  >A11Y</button>

  <div id="a11yPanel" class="a11y-panel" role="dialog" aria-modal="true" aria-labelledby="a11yPanelTitle" hidden>
    <div class="a11y-panel-head">
      <h3 id="a11yPanelTitle" data-i18n="accessibility">Accessibility</h3>
      <button id="a11yClose" class="a11y-close" type="button" aria-label="Close" data-i18n-aria="close">x</button>
    </div>
    <div class="a11y-panel-body">
      <button class="a11y-opt" type="button" data-a11y="bigtext" data-i18n="biggerText">Bigger text</button>
      <button class="a11y-opt" type="button" data-a11y="contrast" data-i18n="highContrast">High contrast</button>
      <button class="a11y-opt" type="button" data-a11y="underline" data-i18n="underlineLinks">Underline links</button>
      <button class="a11y-opt danger" type="button" data-a11y="reset" data-i18n="a11yReset">Reset</button>
    </div>
  </div>

  <header class="topbar" role="banner">
    <div class="brand" aria-label="Brand" data-i18n-aria="brand">
      <span class="logo" aria-hidden="true">$</span>
      <div class="brand-copy">
        <div class="title" data-i18n="appTitle">Expense Tracker</div>
        <p class="tagline" data-i18n="landingTag">Smart tracking • Clear insights</p>
      </div>
    </div>

    <div class="right-actions">
      <label class="sr-only" for="langSelect" data-i18n="language">Language</label>
      <select id="langSelect" class="select" aria-label="Language" data-i18n-aria="language">
        <option value="en" data-i18n="langEnglish">English</option>
        <option value="ar" data-i18n="langArabic">العربية</option>
        <option value="he" data-i18n="langHebrew">עברית</option>
      </select>
    </div>
  </header>

  <main id="main" class="wrap" role="main">
    <section id="landingView" class="landing-view" aria-label="Landing" data-i18n-aria="intro">
      <span class="landing-blob landing-blob-a" aria-hidden="true"></span>
      <span class="landing-blob landing-blob-b" aria-hidden="true"></span>
      <span class="landing-blob landing-blob-c" aria-hidden="true"></span>

      <div class="landing-stack">
        <h1 class="landing-brand">
          <span class="landing-brand-icon" aria-hidden="true">$</span>
          <span data-i18n="appTitle">Expense Tracker</span>
        </h1>

        <div class="landing-glass-card">
          <h2 class="landing-title" data-i18n="letsGetStarted">Let's Get Started</h2>
          <div class="landing-actions">
            <button class="btn primary auth-cta" id="btnOpenLogin" type="button" data-i18n="login">Login</button>
            <button class="btn auth-cta" id="btnOpenRegister" type="button" data-i18n="signup">Sign Up</button>
          </div>
          <p class="landing-description" data-i18n="landingDesc">Track your expenses, manage your budget, and gain clear financial insights - all in one place.</p>
        </div>
      </div>
    </section>

    <section id="loginView" class="auth-view" hidden aria-labelledby="loginTitle">
      <div class="auth-view-card">
        <aside class="auth-decor" aria-hidden="true">
          <span class="blob blob-a"></span>
          <span class="blob blob-b"></span>
          <span class="grid-lines"></span>
        </aside>

        <section class="auth-form-pane">
          <div class="auth-head">
            <h2 id="loginTitle" data-i18n="login">Login</h2>
          </div>

          <form id="loginForm" novalidate>
            <label class="lbl" for="loginEmail">
              <span data-i18n="email">Email</span>
              <input type="email" id="loginEmail" autocomplete="email" required />
            </label>

            <label class="lbl" for="loginPassword">
              <span data-i18n="password">Password</span>
              <input type="password" id="loginPassword" autocomplete="current-password" required />
            </label>

            <div id="loginErrors" class="errors" aria-live="polite"></div>

            <button class="btn primary full" type="submit" data-i18n="login">Login</button>
          </form>

          <p class="switch">
            <span data-i18n="authNoAccountQ">Don't have an account?</span>
            <button class="link" id="toRegister" type="button" data-i18n="signup">Sign Up</button>
          </p>
        </section>
      </div>
    </section>

    <section id="registerView" class="auth-view" hidden aria-labelledby="registerTitle">
      <div class="auth-view-card">
        <aside class="auth-decor auth-decor-alt" aria-hidden="true">
          <span class="blob blob-a"></span>
          <span class="blob blob-b"></span>
          <span class="grid-lines"></span>
        </aside>

        <section class="auth-form-pane">
          <div class="auth-head">
            <h2 id="registerTitle" data-i18n="signup">Sign Up</h2>
          </div>

          <form id="registerForm" novalidate>
            <label class="lbl" for="regName">
              <span data-i18n="firstNameOptional">First name (optional)</span>
              <input type="text" id="regName" autocomplete="given-name" />
            </label>

            <label class="lbl" for="regEmail">
              <span data-i18n="email">Email</span>
              <input type="email" id="regEmail" autocomplete="email" required />
            </label>

            <label class="lbl" for="regPassword">
              <span data-i18n="password">Password</span>
              <input type="password" id="regPassword" autocomplete="new-password" required />
            </label>

            <label class="lbl" for="regConfirmPassword">
              <span data-i18n="confirmPassword">Confirm password</span>
              <input type="password" id="regConfirmPassword" autocomplete="new-password" required />
            </label>

            <div id="registerErrors" class="errors" aria-live="polite"></div>

            <button class="btn primary full" type="submit" data-i18n="createAccount">Create Account</button>
          </form>

          <p class="switch">
            <span data-i18n="authHaveAccountQ">Already have an account?</span>
            <button class="link" id="toLogin" type="button" data-i18n="login">Login</button>
          </p>
        </section>
      </div>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
